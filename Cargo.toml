[package]
name = "ikigai-repo"
description = "Git and gh as ikigai resources: typed, capability-gated repo facades (urn:repo:*)."
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-repo"

[dependencies]
# The released kernel, consumed from crates.io. This module is NATIVE-ONLY: it
# spawns subprocesses (std::process), the one thing a wasm module can't — the
# platform seam, like ikigai-personal's EventKit. No wasm face by design.
# 0.2.0 is the streams release (ledger #2261). The old "0.1.108" pin (the
# floor for typed `Error::OverBudget` output refusals) meant <0.2.0 under 0.x
# rules, so this is a deliberate re-pin, and core's types are in this crate's
# API: hence this crate's own minor bump to 0.3.0. The 0.2.1 floor now supplies
# the body helpers used by the additive process-body path.
# 0.3.0 is the scoped content store (ledger #2965): held content is scoped to
# whoever delivered it, and ContentStore::put/put_replay are root-only. This
# crate calls neither, but under 0.x a caret is a ceiling and core's types are
# in this crate's API, so this is a deliberate re-pin and a minor bump to 0.4.0.
ikigai-core = "0.3.0"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`). 0.12 added BODIES
# and BODY-INPUTS by default; 0.14 is the release on core 0.3.0. Under 0.x a
# caret is also a ceiling: "0.14.0" means >=0.14.0, <0.15.0, so a later minor
# needs a deliberate re-pin.
ikigai-conformance = "0.14.0"
