[package]
name = "ikigai-repo"
description = "Git / gh / cargo as ikigai resources: a capability-gated exec seam + typed repo facades (urn:system:exec, urn:repo:*)."
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-repo"

[dependencies]
# The released kernel, consumed from crates.io. This module is NATIVE-ONLY: it
# spawns subprocesses (std::process), the one thing a wasm module can't — the
# platform seam, like ikigai-personal's EventKit. No wasm face by design.
# 0.1.89 is the floor for `space_iri` and for `bind` dropping a name (ledger
# #987). A 0.1.x caret is a range up to <0.2.0.
ikigai-core = "0.1.89"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). 0.8.0 is the floor for
# REQUIRED and `Checks::STATIC` (ledger #329, #348). Under 0.x a caret is also a
# CEILING (<0.9.0): a later minor of the suite is a deliberate re-pin, not a
# silent upgrade.
ikigai-conformance = "0.8.0"
